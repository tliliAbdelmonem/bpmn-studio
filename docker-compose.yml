# Local development infrastructure for BPMN Studio. Not for production.
#
# - postgres:      the app database (BpmnModel, versions, deployments)
# - orchestration: Camunda 8.10 Orchestration Cluster (Zeebe + Operate + Tasklist)
#                  REST API v2 on http://localhost:8080/v2 (API unprotected),
#                  Operate on http://localhost:8080/operate (UI login demo/demo).
#
# Based on Camunda's lightweight Docker Compose for 8.10
# (github.com/camunda/camunda-distributions, docker-compose/versions/camunda-8.10),
# trimmed to the orchestration service with H2 secondary storage. Connectors,
# Optimize, Identity and Keycloak are not needed here.
name: bpmn-studio

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bpmn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bpmn}
      POSTGRES_DB: ${POSTGRES_DB:-bpmn_studio}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10.4}
    user: '0:0'
    entrypoint:
      - /bin/sh
      - -c
      - chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: 'no'

  orchestration:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.10.4}
    ports:
      - '8080:8080' # REST API v2, Operate, Tasklist
      - '26500:26500' # gRPC gateway
      - '9600:9600' # management / health
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 &&
          echo -e "GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n" >&3 &&
          head -n 1 <&3 | grep -q "200"'
      interval: 5s
      retries: 30
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  camunda:
  camunda-data:

configs:
  orchestration-config:
    content: |
      camunda:
        system:
          cpu-thread-count: "3"
          io-thread-count: "3"
        security:
          authentication:
            method: "basic"
            unprotectedApi: true
          authorizations:
            enabled: false
          initialization:
            users:
              - username: "demo"
                password: "demo"
                name: "Demo User"
                email: "demo@demo.com"
            defaultRoles.admin.users:
              - "demo"
        data:
          secondary-storage:
            type: rdbms
            rdbms:
              url: jdbc:h2:file:./camunda-data/h2db
              username: sa
              password:
              flushInterval: PT0.5S
              queueSize: 1000
